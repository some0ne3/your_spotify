---
name: Nightly build CI

on:
  push:
    paths:
      - .github/workflows/nightly.yml
      - Dockerfile.client.production
      - Dockerfile.server.production
      - apps/dev/**
      - apps/client/**
      - apps/server/**
      - yarn.lock
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        service: [client, server]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.${{ matrix.service }}.production
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/some0ne3/your_spotify_${{ matrix.service }}:nightly-${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [client, server]

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/some0ne3/your_spotify_${{ matrix.service }}:nightly \
            -t ghcr.io/some0ne3/your_spotify_${{ matrix.service }}:${{ github.sha }} \
            ghcr.io/some0ne3/your_spotify_${{ matrix.service }}:nightly-amd64 \
            ghcr.io/some0ne3/your_spotify_${{ matrix.service }}:nightly-arm64
